      <div class="mod" style="animation-delay:.08s">${ic('key')}<b>Password safety</b><p>Long passwords, a different one for ERP, email and SBI, and 2-step login.</p></div>
      <div class="mod" style="animation-delay:.16s">${ic('globe')}<b>Safe internet usage</b><p>No unknown .apk files. Be careful on hostel and public Wi-Fi.</p></div></div></div>`;
    a.tick(0);
  };
  const set = i => {
    $('[data-cv]', el).textContent = click[i] + '%'; $('[data-cb]', el).style.width = click[i] + '%';
    $('[data-rv]', el).textContent = rep[i] + '%'; $('[data-rb]', el).style.width = rep[i] + '%';
    const good = i >= 4;
    $('[data-cv]', el).style.color = $('[data-cb]', el).style.background = good ? 'var(--green)' : i ? '#E8A21C' : 'var(--red)';
    $('[data-rv]', el).style.color = $('[data-rb]', el).style.background = good ? 'var(--green)' : '#E8A21C';
    $('[data-lc]', el).setAttribute('points', pts(click, i)); $('[data-lr]', el).setAttribute('points', pts(rep, i));
    $$('[data-months] span', el).forEach((s, k) => s.classList.toggle('on', k === i));
  };
  $('[data-run]', el).onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true; set(0);
    setStatus(el, 'live', 'Training in progress');
    for (let i = 1; i <= 6; i++) { await sleep(650); if (!a.alive()) return; set(i); }
    setStatus(el, 'safe', 'Trained');
    a.fb('safe', 'Clicks came down from 42% to 4%.', 'Before training, almost half the campus clicked a fake test email. After six months, very few click, and most people report it to the IT Cell.');
    b.disabled = false; a.tick(1); a.decide('train', 'defend');
  };
  $('[data-base]', el).onclick = () => { set(0); setStatus(el, '', 'Before training'); };
};

/* ---- 8. Password hygiene ---- */
SIMS[8] = (el, a) => {
  // most common first: position in this list = how many guesses a hacker needs
  const COMMON = ['123456','password','12345678','qwerty','123456789','12345','111111','1234567','abc123','password1','admin','iloveyou','welcome','letmein','qwerty123','p@ssw0rd','pass@123','admin@123','india@123','india123','iiitnr@123','iiitnr123','sunshine','monkey','dragon','football'];
  const WORDS = ['123456','password','12345678','qwerty','abc123','iloveyou','admin','welcome','letmein','monkey','dragon','sunshine','football','india@123','iiitnr@123','p@ssw0rd','pass@123'];
  const SPEED = 1e10;                     // guesses per second (one strong GPU rig, offline)
  const analyse = pw => {
    const L = pw.length, lo = /[a-z]/.test(pw), up = /[A-Z]/.test(pw), di = /\d/.test(pw), sy = /[^A-Za-z0-9]/.test(pw);
    const pool = (lo ? 26 : 0) + (up ? 26 : 0) + (di ? 10 : 0) + (sy ? 33 : 0);
    const bits = L && pool ? L * Math.log2(pool) : 0;
    const rank = COMMON.indexOf(pw.toLowerCase());
    const common = rank >= 0;
    // word/name + optional symbol + digits (or digits + word): the first rule hackers try
    const pattern = !common && (/^[a-z]+[@#!._$*-]?\d{1,6}[@#!._$*-]?$/i.test(pw) || /^\d{1,6}[@#!._$*-]?[a-z]+$/i.test(pw));
    let guesses;
    if (common) guesses = rank + 1;
    else if (pattern) guesses = 2e5 * 3 * (sy ? 10 : 1) * Math.pow(10, (pw.match(/\d/g) || []).length);
    else guesses = Math.max(1, Math.pow(2, bits) / 2);
    const secs = guesses / SPEED;
    const level = !L ? -1 : secs < 1 ? 0 : secs < 3600 ? 1 : secs < 3.15e7 ? 2 : secs < 3.15e10 ? 3 : 4;
    return { L, lo, up, di, sy, bits, common, rank, pattern, guesses, secs, level };
  };
  const human = s => {
    if (s < 0.001) return 'under a millisecond';
    if (s < 1) return Math.round(s * 1000) + ' milliseconds';
    if (s > 3.15e19) return 'over a trillion years';
    const u = [['seconds',60],['minutes',60],['hours',24],['days',365],['years',1e3],['thousand years',1e3],['million years',1e3],['billion years',Infinity]];
    let v = s, i = 0; while (i < u.length - 1 && v >= u[i][1]) { v /= u[i][1]; i++; }
    return (v < 10 ? v.toFixed(1) : Math.round(v).toLocaleString('en-IN')) + ' ' + u[i][0];
  };
  const feel = s => s < 0.5 ? 'Faster than a blink' : s < 60 ? 'Less than a minute' : s < 3600 ? 'Before your chai gets cold'
    : s < 86400 ? 'Within a day' : s < 3.15e7 ? 'Within a year' : s < 3.15e9 ? 'Years to decades' : 'Longer than a lifetime';
  const count = n => n < 1e3 ? Math.round(n).toString() : n < 1e5 ? Math.round(n / 1e3) + ' thousand' : n < 1e7 ? +(n / 1e5).toFixed(1) + ' lakh'
    : n < 1e11 ? Math.round(n / 1e7).toLocaleString('en-IN') + ' crore' : '10<sup>' + Math.round(Math.log10(n)) + '</sup>';
  const LV = [['Very weak','var(--red)'],['Weak','var(--red)'],['Fair','#E8A21C'],['Strong','var(--green)'],['Very strong','var(--green)']];
  el.innerHTML = `${toolbar('key', 'Password lab', 'Ready')}<p class="hint" style="margin-top:-6px">Type a password or pick one below. Then press the button to see how fast a hacker can guess it.</p>
    <div class="sheet pw-field"><input data-in type="text" placeholder="Type a sample password" autocomplete="off" spellcheck="false" aria-label="Sample password"><button class="btn btn-dark" data-crack disabled>${ic('play')}Try to crack it</button></div>
    <div class="chips"><span class="hint">Try:</span>${['123456','password','iiitnr@123','Riya2002','Riya@2002','S3cure@2026','blue-Tiger-river-42!'].map(p => `<button class="chip" data-p="${p}">${p}</button>`).join('')}</div>
    <div class="sheet pad">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px"><b data-lvl style="font-size:18px">Waiting for a password</b><span class="hint">Use only sample passwords, never your real one.</span></div>
      <div class="bars" data-bars><span></span><span></span><span></span><span></span></div>
      <ul class="rules" style="margin-top:16px" data-rules>
        <li data-r="len">${ic('check')}12 or more characters</li><li data-r="case">${ic('check')}Upper and lower case</li>
        <li data-r="di">${ic('check')}Numbers</li><li data-r="sy">${ic('check')}Symbols</li>
        <li data-r="nc">${ic('check')}Not a common or leaked password</li><li data-r="np">${ic('check')}Not name + year, like Riya2002</li>
      </ul>
    </div>
    <div class="sheet"><div class="pw-stats">
      <div class="stat"><small>Length</small><b data-len>0</b></div>
      <div class="stat"><small>Guesses needed</small><b data-gs>–</b></div>
      <div class="stat"><small>Time to crack</small><b data-time>–</b><span class="pw-feel" data-feel></span></div>
    </div></div>
    <div class="term" data-term><span class="d"># A hacker's computer tries about 1,000 crore guesses every second.</span></div>`;
  const inp = $('[data-in]', el), crackBtn = $('[data-crack]', el);
  const colour = r => r.level >= 3 ? 'var(--green)' : r.level === 2 ? '#B86E00' : 'var(--red)';
  const update = () => {
    const pw = inp.value, r = analyse(pw);
    crackBtn.disabled = !pw; if (pw) a.tick(0);
    $('[data-len]', el).textContent = r.L;
    $('[data-gs]', el).innerHTML = pw ? count(r.guesses) : '–';
    $('[data-time]', el).textContent = pw ? human(r.secs) : '–';
    $('[data-time]', el).style.color = pw ? colour(r) : '';
    $('[data-feel]', el).textContent = pw ? feel(r.secs) : '';
    $$('[data-bars] span', el).forEach((s, i) => s.style.background = pw && i <= Math.max(0, r.level - 1) ? LV[r.level][1] : '');
    $('[data-lvl]', el).textContent = pw ? LV[r.level][0] + (r.common ? ' · already leaked online' : r.pattern ? ' · easy-to-guess pattern' : '') : 'Waiting for a password';
    $('[data-lvl]', el).style.color = pw ? LV[r.level][1] : '';
    const ok = { len: r.L >= 12, case: r.lo && r.up, di: r.di, sy: r.sy, nc: pw && !r.common, np: pw && !r.pattern };
    $$('[data-rules] li', el).forEach(li => li.classList.toggle('ok', !!ok[li.dataset.r]));
  };
  inp.addEventListener('input', update);
  $$('[data-p]', el).forEach(c => c.onclick = () => { inp.value = c.dataset.p; update(); });
  crackBtn.onclick = async () => {
    const pw = inp.value; if (!pw) return; const r = analyse(pw), safe = pw.replace(/[<>&"]/g, ''), t = human(r.secs);
    const term = $('[data-term]', el);
    const p = h => { term.insertAdjacentHTML('beforeend', '<br>' + h); term.scrollTop = term.scrollHeight; };
    crackBtn.disabled = inp.disabled = true; setStatus(el, 'live', 'Cracking');
    term.innerHTML = `<span class="p">$</span> crack-sim --wordlist leaked-passwords.txt --rules common`;
    await sleep(400); p('<span class="d">Step 1: trying passwords that already leaked online…</span>');
    let hit = false;
    for (const w of WORDS) {
      await sleep(80); if (!a.alive()) return;
      if (r.common && w === pw.toLowerCase()) { hit = true; p(`<span class="r">MATCH  ${w}</span>`); break; }
      p(`<span class="d">try    ${w}</span>`);
    }
    if (r.common && !hit) p(`<span class="r">MATCH  ${safe}</span>`);
    if (!r.common) {
      await sleep(250); p('<span class="d">Step 2: trying name/word + @ + numbers…</span>');
      await sleep(400);
      if (r.pattern) p(`<span class="r">MATCH  ${safe}  after about ${count(r.guesses)} guesses</span>`);
      else { p('<span class="g">No match</span>'); await sleep(250); p(`<span class="y">Step 3: brute force, about ${count(r.guesses)} guesses needed</span>`); }
    }
    await sleep(350);
    if (r.level <= 2) {
      p(`<span class="r">Cracked in ${t}</span>`); setStatus(el, 'danger', r.secs < 1 ? 'Cracked' : 'Crackable');
      const title = r.common ? `"${safe}" is #${r.rank + 1} on the leaked list.` : `"${safe}" cracked in ${t}.`;
      const text = r.common ? `Hackers try the most common passwords first. This one fell on guess number ${r.rank + 1}, ${feel(r.secs).toLowerCase()}.`
        : r.pattern ? `Name or word + @ + year/number is the first pattern hackers try. Adding @ or 123 does not make it strong. ${feel(r.secs)}.`
        : `Too short or too simple. ${feel(r.secs)}. Use 12+ characters, or 4 random words together.`;
      a.fb('danger', title, text);
      a.decide('pw', 'breach');
    } else {
      p(`<span class="g">Estimated time to crack: ${t}</span>`); setStatus(el, 'safe', 'Resistant');
      a.fb('safe', `Cracking it would take ${t}.`, `${feel(r.secs)}. Long, random and different for every account. Keep it in a password manager and turn on 2-step login.`);
      a.decide('pw', 'defend');
    }
    a.tick(1); crackBtn.disabled = inp.disabled = false;
  };
};

/* ================= Thank-you animation ================= */
let confettiRaf = 0;
function playThanks(){
  playHand('thanks', $('#thHand'));
  const cv = $('#confetti'); if (!cv || RM) return;
  cancelAnimationFrame(confettiRaf);
  const ctx = cv.getContext('2d');
  const W = cv.width = cv.clientWidth * 2, H = cv.height = cv.clientHeight * 2;
  const colors = ['#C9356B', '#2457D6', '#20B858', '#F5B83D', '#16171A', '#86A8FF'];
  const bits = Array.from({ length: 160 }, (_, i) => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .55,
    vx: (Math.random() - .5) * 26, vy: -(Math.random() * 30 + 18),
    r: Math.random() * 6.3, vr: (Math.random() - .5) * .35,
    w: 10 + Math.random() * 12, h: 6 + Math.random() * 8, c: colors[i % colors.length],
  }));
  const t0 = performance.now();
  const tick = now => {
    const t = now - t0;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - 2600) / 900);
    for (const b of bits) {
      b.vy += .9; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 1.5)) + 1); ctx.restore();
    }
    if (t < 3500 && state.cur === 'thanks') confettiRaf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
  };
  confettiRaf = requestAnimationFrame(tick);
}

/* ================= Projector zoom ================= */
let Z = +localStorage.getItem('hfZoom2') || 1.35;
// Z is the presenter's preferred zoom; fit() lowers it per screen so nothing needs scrolling.
const isMobile = () => innerWidth < 760 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 560);
const MIN_Z = 1.15;   // never below ~18px text; beyond that the screen scrolls
let fitting = false;
function fit(){
  if (fitting) return; fitting = true;
  const root = document.documentElement, sc = document.querySelector('.screen.active');
  let z = isMobile() ? 1 : Z; root.style.setProperty('--z', z);
  for (let k = 0; sc && !isMobile() && k < 4; k++) {
    if (sc.scrollHeight <= sc.clientHeight + 2) break;      // already fits: never shrink
    const chrome = document.body.classList.contains('at-intro') ? 60 : 60 + 76;
    const need = sc.scrollHeight + chrome + 4;              // content + top bar + bottom bar
    const zFit = innerHeight / need;
    if (zFit >= z - 0.005) break;
    z = Math.max(MIN_Z, Math.min(Z, zFit));
    root.style.setProperty('--z', z.toFixed(3));
    if (z === MIN_Z) break;
  }
  fitting = false;
}
let fitRaf = 0;
const queueFit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fit); };
function applyZoom(){
  document.body.classList.toggle('mobile', isMobile());
  document.documentElement.classList.toggle('mobile', isMobile());
  document.body.classList.toggle('narrow', innerWidth / (isMobile() ? 1 : Z) < 1000);
  fit();
}
addEventListener('resize', applyZoom);
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => { if (isMobile()) e.preventDefault(); }, { passive: false }));
const ro = new ResizeObserver(queueFit);
document.querySelectorAll('.screen > *').forEach(el => ro.observe(el));
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '+' || e.key === '=') Z = Math.min(2.4, +(Z + 0.1).toFixed(2));
  else if (e.key === '-' || e.key === '_') Z = Math.max(1, +(Z - 0.1).toFixed(2));
  else return;
  localStorage.setItem('hfZoom2', Z); applyZoom();
});
applyZoom();

/* ================= Init ================= */
buildShell();
EXP.forEach(e => SIMS[e.n]($(`#stage${e.n}`), api(e.n)));
refresh();
go(0);
</script>
