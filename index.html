<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Human Factors Lab · 8 Live Experiments</title>
<style>
:root{
  --ink:#16171A; --ink-2:#3C4047; --muted:#62666E; --faint:#9A9EA6;
  --line:#E5E5E2; --line-2:#D4D4D0;
  --bg:#FFFFFF; --canvas:#F5F5F2; --hover:#EFEFEB;
  --green:#14A44D; --green-ink:#0C6B32; --green-bg:#DDF4E4; --green-btn:#20B858;
  --red:#D93B3B; --red-ink:#A12424; --red-bg:#FCE4E2;
  --amber:#B86E00; --amber-bg:#FCEFCB;
  --blue:#2457D6;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}

/* ---------- Shell (Brilliant-style top bar, Codecademy-style bottom bar) ---------- */
.app{display:grid;grid-template-rows:60px 1fr 76px;height:100vh}
.top{display:grid;grid-template-columns:200px 1fr 200px;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:5}
.top-left{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);transition:background .15s}
.icon-btn:hover{background:var(--hover)}
.course{font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.segs{display:flex;gap:6px;justify-self:center;width:min(560px,100%)}
.seg{flex:1;height:10px;border-radius:6px;background:#EBEBE7;position:relative;transition:background .25s}
.seg::after{content:"";position:absolute;inset:-10px 0}
.seg:hover{background:var(--line-2)}
.seg[data-st="defend"]{background:var(--green-btn)}
.seg[data-st="breach"]{background:var(--red)}
.seg[aria-current="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.top-right{display:flex;justify-content:flex-end;align-items:center;gap:14px;font-size:14px;color:var(--muted)}
.tally{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.tally .i{width:17px;height:17px}
.tally.g .i{color:var(--green)} .tally.r .i{color:var(--red)}

main{position:relative;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility 0s linear .25s}
.screen.active{opacity:1;visibility:visible;transition:opacity .25s var(--ease)}

.bottom{display:flex;align-items:center;gap:16px;padding:0 28px;border-top:1px solid var(--line);background:#fff;transition:background .25s,border-color .25s}
.bottom .msg{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.bottom .msg .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.bottom .msg .ico .i{width:20px;height:20px;stroke-width:2.6}
.bottom .msg b{font-size:17px;white-space:nowrap}
.bottom .msg span{color:var(--ink-2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom .pos{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bottom.safe{background:var(--green-bg);border-color:#BFE8CC}
.bottom.safe .ico{background:var(--green-btn);color:#fff}
.bottom.safe b{color:var(--green-ink)}
.bottom.danger{background:var(--red-bg);border-color:#F4C5C1}
.bottom.danger .ico{background:var(--red);color:#fff}
.bottom.danger b{color:var(--red-ink)}
.bar-btns{display:flex;gap:10px}
.bottom.pop{animation:barIn .35s var(--ease)}
@keyframes barIn{from{transform:translateY(100%)}to{transform:none}}
.bottom.pop .ico{animation:icoPop .45s .15s var(--ease) both}
@keyframes icoPop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.tally.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.45)}}
.work.flash-safe .stage>.toolbar,.work.flash-danger .stage>.toolbar{transition:none}
.story-art svg{transition:transform .3s var(--ease)}
.story:hover .story-art svg{transform:scale(1.03)}

/* Buttons (Brilliant: pill, solid, with bottom lip) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;background:#fff;border:1px solid var(--line-2);color:var(--ink);box-shadow:0 2px 0 var(--line-2);transition:transform .08s,background .15s,box-shadow .08s;white-space:nowrap}
.btn:hover{background:var(--canvas)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 2px 0 #000}
.btn-dark:hover{background:#2A2C31}
.btn-green{background:var(--green-btn);border-color:var(--green-btn);color:#fff;box-shadow:0 2px 0 #138A40}
.btn-green:hover{background:#1CA74F}
.btn-soft{background:rgba(0,0,0,.07);border-color:transparent;box-shadow:none}
.btn-soft:hover{background:rgba(0,0,0,.11)}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.chosen{outline:2px solid var(--ink);outline-offset:2px}
.choice{display:flex;flex-direction:column;gap:10px}
.choice-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;font-size:15.5px;font-weight:500;box-shadow:0 2px 0 var(--line-2);transition:background .15s,border-color .15s}
.choice-btn:hover{background:var(--canvas)}
.choice-btn .k{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.choice-btn.sel-bad{border-color:var(--red);background:var(--red-bg);box-shadow:0 2px 0 #E9A8A2}
.choice-btn.sel-bad .k{border-color:var(--red);background:var(--red);color:#fff}
.choice-btn.sel-good{border-color:var(--green);background:var(--green-bg);box-shadow:0 2px 0 #9ED9B2}
.choice-btn.sel-good .k{border-color:var(--green);background:var(--green);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- Intro / summary (course overview) ---------- */
.page{max-width:1120px;margin:0 auto;padding:56px 40px 64px}
.overview{display:grid;grid-template-columns:1fr 1.1fr;gap:72px;align-items:start}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted)}
.overview h1{font-size:clamp(40px,4.6vw,60px);line-height:1.04;letter-spacing:-.035em;font-weight:750;margin:12px 0 18px}
.overview .lead{font-size:19px;color:var(--ink-2);margin-bottom:28px;max-width:470px}
.chain{margin-top:40px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chain-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);font-size:15px}
.chain-row:first-child{border-top:0}
.chain-row .ic{width:34px;height:34px;border-radius:9px;background:var(--canvas);display:grid;place-items:center;color:var(--ink-2)}
.chain-row .t{flex:1;font-weight:600}
.chain-row .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.chain-row .s{font-size:13px;font-weight:600;color:var(--green)}
.chain-row.weak{background:var(--red-bg)}
.chain-row.weak .ic{background:#fff;color:var(--red)}
.chain-row.weak .s{color:var(--red-ink)}
.chain-cap{font-size:13.5px;color:var(--muted);margin-top:10px}
.path h2{font-size:15px;font-weight:600;color:var(--muted);margin-bottom:10px}
.lesson{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:14px 12px;border-radius:14px;transition:background .15s}
.lesson:hover{background:var(--canvas)}
.lesson .num{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;color:var(--ink-2);background:#fff}
.lesson[data-st="defend"] .num{background:var(--green-btn);border-color:var(--green-btn);color:#fff}
.lesson[data-st="breach"] .num{background:var(--red);border-color:var(--red);color:#fff}
.lesson .txt{flex:1;min-width:0}
.lesson .txt b{display:block;font-size:16px}
.lesson .txt span{font-size:14px;color:var(--muted)}
.lesson .pg{font-size:13px;color:var(--faint);white-space:nowrap}
.lesson .st{font-size:13px;font-weight:600;white-space:nowrap}
.lesson .conn{position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;margin:28px 0 8px;overflow:hidden}
.stats div{padding:18px 20px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats small{font-size:13.5px;color:var(--muted)}
.stats b{display:block;font-size:38px;letter-spacing:-.03em;line-height:1.15}
.takeaway{margin-top:28px;font-size:clamp(22px,2.2vw,30px);line-height:1.3;font-weight:650;letter-spacing:-.02em;max-width:820px}
.takeaway span{color:var(--muted)}

/* ---------- Lesson layout (Codecademy: learn panel + workspace) ---------- */
.lesson-wrap{display:grid;grid-template-columns:minmax(320px,400px) 1fr;min-height:100%}
.learn{border-right:1px solid var(--line);padding:32px 30px 40px;display:flex;flex-direction:column;gap:22px}
.learn .eyebrow{display:flex;justify-content:space-between}
.learn h1{font-size:32px;line-height:1.12;letter-spacing:-.025em;font-weight:750;margin-top:6px}
.learn h3{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
.learn p{font-size:15.5px;color:var(--ink-2)}
.learn p strong{color:var(--ink)}
.proc{list-style:none;display:flex;flex-direction:column;gap:8px}
.proc li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-size:15px;color:var(--ink-2);transition:background .3s,border-color .3s}
.proc .box{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;margin-top:1px;transition:all .25s}
.proc .box .i{width:13px;height:13px;stroke-width:3.2;opacity:0;transition:opacity .2s}
.proc li.done{background:#FBF3D9;border-color:#F1E2B0;color:var(--ink)}
.proc li.done .box{background:#5B6470;border-color:#5B6470;color:#fff}
.proc li.done .box .i{opacity:1}
.simple{background:#FFF0F5;border-radius:14px;padding:14px 16px;font-size:16.5px;line-height:1.45;color:var(--ink)}
.simple b{display:block;font-size:13px;color:#C9356B;margin-bottom:4px}
.hand-svg{width:100%;height:auto;display:block}
.hand-intro{max-width:340px;margin:-4px 0 22px}
.story-art{position:relative}
.hand-note{position:absolute;left:2%;right:2%;bottom:3%;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.hand-note:empty{display:none}
.hand-concl{margin-top:4px;max-width:340px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.story{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 24px 14px 14px}
.story-art svg,.meet-art svg{width:100%;height:auto;display:block}
.story-k{font-size:13px;font-weight:700;color:#C9356B;margin-bottom:4px}
.story-t{font-size:19px;line-height:1.4;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.ask{display:inline-flex;gap:10px;align-items:center;margin-top:12px;padding:9px 14px;border-radius:12px;background:var(--amber-bg);color:#7A4A00;font-size:15px}
.ask .i{width:20px;height:20px}
.stage{display:flex;flex-direction:column;gap:18px}
.tb{border:1px solid var(--line);border-radius:12px;padding:0 14px}
.tb summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 0;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.tb summary::-webkit-details-marker{display:none}
.tb summary .i{width:16px;height:16px;transition:transform .2s}
.tb[open] summary .i{transform:rotate(90deg)}
.tb>div{padding-bottom:12px}
.meet{display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:center;margin-top:36px;padding:16px 20px 16px 12px;border:1px solid var(--line);border-radius:18px}
.meet-t{font-size:15px;color:var(--muted);margin-bottom:6px}
.meet-s{font-size:18px;line-height:1.4;color:var(--ink)}
.sum-head{display:flex;gap:24px;align-items:center}
.simple{font-size:18px!important}
.concl{border-left:3px solid var(--ink);padding:2px 0 2px 16px;display:none}
.concl.show{display:block;animation:rise .4s var(--ease)}
.concl p{font-size:18px;font-weight:650;color:var(--ink);line-height:1.35}
.concl small{display:block;font-size:13.5px;color:var(--muted);margin-top:6px}

.work{background:var(--canvas);padding:28px 32px 40px;display:flex;flex-direction:column;gap:18px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toolbar .t{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px}
.toolbar .t .i{color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--muted)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.live::before{background:var(--amber);animation:pulse 1.1s infinite}
.status.warn{color:var(--amber)} .status.warn::before{background:var(--amber)}
.status.safe{color:var(--green)} .status.safe::before{background:var(--green)}
.status.danger{color:var(--red)} .status.danger::before{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pad{padding:18px 20px}
.label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
.prompt{font-size:17px;font-weight:600}
.hint{font-size:13.5px;color:var(--muted)}
.list{list-style:none;display:grid;gap:8px}
.list li{display:flex;gap:10px;font-size:14.5px;color:var(--ink-2)}
.list li .i{width:16px;height:16px;margin-top:3px;color:var(--green)}
.list.warn li .i{color:var(--amber)}
@keyframes rise{from{opacity:0}to{opacity:1}}
.fade-in{animation:rise .35s var(--ease) both}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.shake{animation:shake .35s}

/* Modal (Brilliant "Explanation") */
.scrim{position:fixed;inset:0;background:rgba(20,20,22,.4);display:none;place-items:center;z-index:50;padding:24px}
.scrim.open{display:grid;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal{width:min(560px,100%);background:#fff;border-radius:18px;padding:24px 26px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:rise .25s var(--ease)}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-h h4{font-size:19px}
.modal p{color:var(--ink-2);font-size:15.5px;margin-bottom:12px}
.modal .rc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.modal .rc div{background:var(--canvas);border-radius:12px;padding:12px 14px}
.modal .rc small{font-size:12.5px;font-weight:700;color:var(--muted)}
.modal .rc p{margin:2px 0 0;font-size:14.5px;color:var(--ink);font-weight:600}

/* ---------- Exp 1: Chat (Slack-like) ---------- */
.chat-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;background:#E3E8F7;color:#2E428A}
.avatar.me{background:#E7F0E9;color:#2A6B3E}
.chat-name{font-weight:700;display:flex;align-items:center;gap:8px}
.chat-sub{font-size:13px;color:var(--muted)}
.tag-ext{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--amber-bg);color:var(--amber)}
.chat-body{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-height:240px}
.msgrow{display:flex;gap:12px;padding:8px 6px;border-radius:10px;animation:rise .3s var(--ease)}
.msgrow .who{font-weight:700;font-size:14.5px}
.msgrow .who small{font-weight:400;color:var(--faint);margin-left:6px;font-size:12.5px}
.msgrow p{font-size:15.5px;color:var(--ink)}
.msgrow.flagged{background:#FFF7E3}
.ann{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:13.5px;color:var(--amber)}
.ann .i{width:15px;height:15px;margin-top:2px}
.ann b{font-weight:700}
.typing{display:inline-flex;gap:4px;padding:10px 0 10px 56px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- Exp 2/3: Mail ---------- */
.mail{overflow:hidden}
.mail-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:600;background:#FAFAF8}
.mail-bar i{width:10px;height:10px;border-radius:50%;background:#DADAD5;display:inline-block}
.mail-head{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.mail-subj{font-size:20px;font-weight:700;line-height:1.3;margin-bottom:8px}
.mail-meta{font-size:14px;color:var(--muted);line-height:1.75}
.mail-meta b{color:var(--ink);font-weight:600}
.mail-body{padding:18px 22px;font-size:15.5px;line-height:1.6}
.mail-body p{margin-bottom:12px}
.mail-cta{display:inline-block;padding:10px 18px;border-radius:8px;background:#1F4FD1;color:#fff;font-weight:700;text-decoration:none;margin:4px 0 14px}
.mail-status{height:32px;padding:0 16px;display:flex;align-items:center;font-family:var(--mono);font-size:12.5px;background:#FAFAF8;color:var(--muted);border-top:1px solid var(--line)}
.mail-status.bad{color:var(--red);font-weight:700}
.hot{cursor:pointer;border-radius:4px;transition:background .15s,box-shadow .15s;position:relative}
.hunt .hot{box-shadow:0 0 0 1.5px #C9CEDA}
.hot:hover{background:#FFF0C2}
.hot.found{box-shadow:0 0 0 2px var(--red);background:var(--red-bg)}
.mail-cta.found{background:#1F4FD1}
.pin{position:absolute;top:-11px;right:-11px;width:21px;height:21px;border-radius:50%;background:var(--red);color:#fff;font:700 11.5px/21px var(--sans);text-align:center}
.count{font-size:34px;font-weight:750;letter-spacing:-.03em;line-height:1}
.count small{font-size:16px;color:var(--faint);font-weight:500}
.dots{display:flex;gap:6px;margin:10px 0 4px}
.dots span{flex:1;height:6px;border-radius:4px;background:var(--line);transition:background .25s}
.dots span.on{background:var(--red)}
.finds{list-style:none;display:grid;gap:8px}
.finds li{display:flex;gap:12px;padding:12px 14px;font-size:14px;color:var(--ink-2);animation:rise .3s var(--ease)}
.finds li .num{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font:700 11.5px/22px var(--sans);text-align:center;flex:none}
.finds li b{color:var(--ink);display:block;font-size:14.5px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.flow .node{padding:14px 16px;font-size:13.5px;color:var(--muted);border-left:1px solid var(--line);transition:background .35s,color .35s}
.flow .node:first-child{border-left:0}
.flow .node b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.flow .node .st{display:block;margin-top:6px;font-size:12.5px;font-weight:700}
.flow .node.on{background:var(--red-bg)} .flow .node.on .st{color:var(--red-ink)}
.flow .node.ok{background:var(--green-bg)} .flow .node.ok .st{color:var(--green-ink)}
.flow .node.blocked{opacity:.4}

/* Exp 3 */
.inbox{padding:8px}
.inbox-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 14px;border-radius:10px;transition:background .15s}
.inbox-row:hover{background:#EEF2FD}
.inbox-row .who{font-weight:700;width:150px}
.inbox-row .sub{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-row .sub b{color:var(--ink)}
.unread{width:9px;height:9px;border-radius:50%;background:#1F4FD1}
.tok{border-radius:4px;transition:background .2s}
.osint .tok{background:#FFEFC2}
.tok sup{display:none;font:700 10.5px var(--sans);color:var(--amber);margin-left:2px}
.osint .tok sup{display:inline}
.tok.hl{background:#FFD36B!important}
.src{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2);transition:background .15s;animation:rise .3s var(--ease) both}
.src:first-of-type{border-top:0}
.src:hover{background:#FFF8E5}
.src .k{width:24px;height:24px;border-radius:7px;background:var(--amber-bg);color:var(--amber);font:700 12px/24px var(--sans);text-align:center;flex:none}
.src b{color:var(--ink);font-weight:600}
.src div>b:first-child{display:block;font-weight:700}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{text-align:left;padding:10px 12px;border-top:1px solid var(--line)}
.cmp tr:first-child th{border-top:0}
.cmp th{font-size:13px;color:var(--muted);font-weight:700}
.cmp td{color:var(--ink-2)}
.cmp td:last-child{color:var(--ink);font-weight:600}

/* ---------- Exp 4: Phone ---------- */
.phone-wrap{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
.tabs{display:inline-flex;padding:4px;border-radius:999px;background:#E9E9E5;gap:2px}
.tabs button{height:34px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tabs .ok{width:7px;height:7px;border-radius:50%;background:var(--green);display:none}
.tabs .visited .ok{display:block}
.phone{width:296px;height:580px;border-radius:46px;padding:11px;background:#1B1C1F;box-shadow:0 24px 50px rgba(0,0,0,.18)}
.ph{position:relative;height:100%;border-radius:36px;overflow:hidden;background:#fff;display:flex;flex-direction:column;color:#111}
.ph.dark{background:linear-gradient(180deg,#3A4256,#1E2230);color:#fff}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:16px;background:#000;z-index:5}
.ph-status{display:flex;justify-content:space-between;padding:13px 24px 0;font-size:12.5px;font-weight:600;height:42px}
.ph-call{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 16px 26px;text-align:center}
.ph-call .cav{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:12px}
.ph-call .cav .i{width:34px;height:34px}
.ph-call h4{font-size:21px;font-weight:600}
.ph-call .num{font-size:13px;opacity:.7;margin-top:2px}
.ph-call .state{font-size:13px;opacity:.8;margin-top:8px}
.ph-btns{margin-top:auto;display:flex;gap:60px}
.ph-btns button{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ph-btns .dec{background:#EB4B4B}.ph-btns .acc{background:#2DB55D}
.ph-btns .i{width:26px;height:26px}
.ph-btns span{display:block;font-size:12px;opacity:.75;margin-top:6px}
.transcript{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:16px;text-align:left}
.transcript .ln{font-size:13px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.14);animation:rise .3s var(--ease)}
.transcript .ln em{font-style:normal;font-size:11px;opacity:.7;display:block}
.notif{position:absolute;left:9px;right:9px;top:44px;padding:11px 13px;border-radius:18px;background:rgba(250,250,250,.97);color:#111;font-size:12.5px;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:drop .45s var(--ease)}
.notif b{display:block;font-size:11.5px;color:#666;margin-bottom:2px}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.ph-sms{flex:1;display:flex;flex-direction:column}
.ph-sms .top2{text-align:center;padding:4px 0 12px;border-bottom:1px solid #EEE}
.ph-sms .top2 .cav{width:44px;height:44px;border-radius:50%;background:#C9CDD6;margin:0 auto 4px;display:grid;place-items:center;color:#fff}
.ph-sms .top2 div{font-size:13px;font-weight:600}
.ph-sms .top2 small{font-size:11px;color:#888}
.ph-sms .thread{padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.ph-sms .when{font-size:11px;color:#888;text-align:center}
.ph-sms .msg{max-width:88%;padding:10px 13px;border-radius:18px 18px 18px 6px;background:#E9E9EB;font-size:14px;line-height:1.45;animation:rise .3s var(--ease)}
.ph-sms .msg u{color:#1F5FD6}
.redir{display:flex;flex-direction:column}
.redir .u{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:13px;animation:rise .3s var(--ease) both}
.redir .u:first-child{border-top:0}
.redir .u small{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--muted)}
.redir .u.bad{color:var(--red-ink);background:#FFF6F5}

/* ---------- Exp 5: Tailgating ---------- */
.scene{width:100%;height:auto;display:block}
.scene .mv{transition:transform 1.1s var(--ease)}
.scene .door{transform-box:fill-box;transform-origin:left center;transition:transform .6s var(--ease)}
.scene .door.open{transform:scaleX(.16)}
.scene .fade{transition:opacity .35s}
.log{width:100%;border-collapse:collapse;font-size:14px}
.log th,.log td{text-align:left;padding:10px 14px;border-top:1px solid var(--line)}
.log thead th{border-top:0;font-size:13px;color:var(--muted);font-weight:700}
.log td{color:var(--ink-2);font-variant-numeric:tabular-nums}
.log tbody tr{animation:rise .3s var(--ease)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:#EFEFEB;color:var(--ink-2);white-space:nowrap}
.pill.g{background:var(--green-bg);color:var(--green-ink)}
.pill.r{background:var(--red-bg);color:var(--red-ink)}
.pill.y{background:var(--amber-bg);color:var(--amber)}

/* ---------- Exp 6: SIEM ---------- */
.siem td{vertical-align:middle}
.siem .act{color:var(--ink)}
.siem tr.sus td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.siem tr.blocked .act{text-decoration:line-through;color:var(--faint)}
.seg3{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg3 button{height:30px;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);border-left:1px solid var(--line-2)}
.seg3 button:first-child{border-left:0}
.seg3 button:hover{background:var(--canvas)}
.roles{display:grid;grid-template-columns:repeat(4,1fr)}
.role{padding:12px 16px;border-left:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.role:first-child{border-left:0}
.role b{display:block;color:var(--ink);font-size:14.5px}
.meter{height:10px;border-radius:6px;background:#EBEBE7;overflow:hidden}
.meter span{display:block;height:100%;border-radius:6px;transition:width .8s var(--ease),background .8s}

/* ---------- Exp 7: Awareness ---------- */
.mods{display:grid;grid-template-columns:repeat(3,1fr)}
.mod{padding:16px 18px;border-left:1px solid var(--line);animation:rise .35s var(--ease) both}
.mod:first-child{border-left:0}
.mod .i{width:22px;height:22px;color:var(--ink-2);margin-bottom:8px}
.mod b{display:block;margin-bottom:2px}
.mod p{font-size:13.5px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:1fr 1fr}
.metric{padding:18px 20px;border-left:1px solid var(--line)}
.metric:first-child{border-left:0}
.metric .lbl{font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.metric .val{font-size:46px;font-weight:750;letter-spacing:-.04em;line-height:1.1;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.months{display:flex;gap:6px;margin-top:6px}
.months span{flex:1;text-align:center;font-size:12px;font-weight:600;padding:5px 0;border-radius:7px;color:var(--faint);transition:all .25s}
.months span.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- Exp 8: Password ---------- */
.pw-field{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px}
.pw-field input{flex:1;background:none;border:0;outline:0;font-family:var(--mono);font-size:24px;padding:8px 0;min-width:0}
.pw-field:focus-within{box-shadow:0 0 0 2px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-family:var(--mono);font-size:13px;color:var(--ink-2);transition:background .15s}
.chip:hover{background:var(--hover)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bars span{height:8px;border-radius:4px;background:#E7E7E3;transition:background .3s}
.pw-stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:14px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat small{display:block;font-size:13px;color:var(--muted)}
.stat b{font-size:20px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.rules{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.rules li{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--faint);transition:color .2s}
.rules li .i{width:16px;height:16px}
.rules li.ok{color:var(--ink)}
.rules li.ok .i{color:var(--green)}
.term{font-family:var(--mono);font-size:13px;line-height:1.7;background:#141518;border-radius:14px;padding:14px 16px;height:210px;overflow-y:auto;color:#C9CDD4}
.term .p{color:#8FB3FF}.term .g{color:#5FD38D}.term .r{color:#FF7B7B}.term .y{color:#F4C55B}.term .d{color:#7C818A}


/* ================= Projector mode: minimal, large type =================
   Everything is designed at 16px and zoomed (default 1.625 => 26px body text).
   +/- keys change the zoom; narrow screens stack into one column. */
.app{zoom:var(--z,1.35);height:calc(100vh / var(--z,1.35))}
.modal{zoom:var(--z,1.35)}

/* calmer surfaces */
.sheet{box-shadow:none;border-color:#ECECE9;border-radius:18px}
.work{gap:16px;background:#F7F7F5;padding:20px 28px 28px}
.story{border:0;background:transparent;padding:0;grid-template-columns:170px 1fr;gap:22px}
.story-k{color:var(--muted);font-size:14px}
.story-t{font-size:18px;font-weight:600}
.ask{background:none;padding:0;margin-top:10px;color:var(--ink);font-size:16px;gap:10px}
.ask .i{color:var(--muted)}
.hand-note{box-shadow:none;background:rgba(255,255,255,.96)}
.simple{background:none!important;padding:0!important;font-size:18px!important;line-height:1.4;color:var(--ink-2)}
.simple b{display:none}
.learn{gap:18px;padding:26px 28px 36px}
.learn h1{font-size:30px}
.proc{gap:4px}
.proc li{border:0;background:none!important;padding:7px 0;font-size:16px}
.proc li.done{color:var(--ink)}
.proc li.done .box{background:var(--ink);border-color:var(--ink)}
.tb{border:0;padding:0}
.tb summary{font-size:14px;color:var(--muted);padding:4px 0}
.meet{border:0;padding:0;margin-top:40px}
.meet-s{font-size:18px}
.meet-t{font-size:14px}
.chain-cap,.eyebrow{font-size:14px}
.overview .lead{font-size:18px}
.split{grid-template-columns:1.25fr 1fr}
body.narrow .split{grid-template-columns:1fr}
.scene{max-height:300px}
.story-art svg{max-height:100px}
.msgrow.flagged{background:#FFF8E8}
.tag-ext{font-size:13px}
.inbox-row .who{width:auto;margin-right:6px}

/* larger small text (x1.625 on screen) */
.hint,.note{font-size:16px}
.toolbar .t{font-size:16px}
.status{font-size:14px}
.prompt{font-size:18px}
.choice-btn{font-size:16px;padding:14px 18px}
.btn{font-size:16px}
.list li{font-size:16px}
.chat-sub,.mail-bar,.mail-status{font-size:14px}
.msgrow p,.mail-body{font-size:16px}
.mail-meta{font-size:15px}
.mail-subj{font-size:20px}
.ann{font-size:14.5px}
.finds li,.src{font-size:15px}
.cmp,.log{font-size:15px}
.cmp th,.log thead th{font-size:14px}
.role{font-size:14px}
.metric .lbl,.legend{font-size:14px}
.months span{font-size:13px}
.rules li{font-size:15px}
.stat small{font-size:14px}
.term{font-size:14px}
.pill{font-size:13.5px;height:26px}
.seg3 button{font-size:13.5px;height:32px}
.tabs button{font-size:15px}
.lesson .txt b{font-size:17px}
.lesson .txt span{font-size:15px}
.lesson .pg,.lesson .st{font-size:14px}
.bottom .msg b{font-size:18px}
.bottom .msg span,.bottom .pos{font-size:16px}
.stats small{font-size:14px}
.modal p{font-size:16px}
.count small{font-size:16px}
.dots{display:none}

/* compact rules so each screen fits */
.page{padding:28px 40px 32px}
.overview{gap:56px}
.overview h1{margin:8px 0 6px}
.hand-intro{margin:0 0 14px}
.overview .lead{margin-bottom:20px}
.meet{margin-top:26px;grid-template-columns:130px 1fr}
.path h2{margin-bottom:4px}
.lesson{padding:8px 10px}
.lesson .num{width:34px;height:34px;font-size:14px}
.lesson .txt span{display:block;line-height:1.35}
.sum-head .meet-art{width:130px!important}
.stats{margin:18px 0 4px}
.stats div{padding:12px 18px}
.stats b{font-size:30px}
.takeaway{margin-top:16px;font-size:22px}
.phone{width:260px;height:500px;border-radius:40px}
.ph-call{padding:20px 14px 18px}
.scene{max-height:240px;margin:0 auto}
.metric{padding:14px 18px}
.metric .val{font-size:34px;margin:2px 0 8px}
.months{margin-top:2px}
[data-lc]{}
.term{height:150px}
.pw-field input{font-size:20px;padding:4px 0}
.mods .mod{padding:12px 16px}
.mods .mod p{display:none}

/* theory slides */
.tdots{display:flex;gap:5px;align-items:center;flex:none;margin-right:8px}
.tdot{width:10px;height:10px;border-radius:50%;background:#E3E3DF;position:relative;transition:background .2s}
.tdot::after{content:"";position:absolute;inset:-8px}
.tdot.seen{background:#A9ADB4}
.tdot[aria-current="true"]{background:var(--ink);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.segs{align-items:center;width:min(720px,100%)}
.learn-chips{display:flex;flex-wrap:wrap;gap:6px}
.learn-chips button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13.5px;font-weight:600;color:var(--ink-2);background:#fff}
.learn-chips button:hover{background:var(--canvas)}
.learn-chips b{font-size:12px;color:var(--faint)}
.theory{display:grid;grid-template-columns:1fr 1.15fr;gap:56px;align-items:center;max-width:1280px;margin:0 auto;padding:28px 48px 32px;min-height:100%}
.th-art svg{width:100%;height:auto;max-height:330px;display:block}
.th-hand{max-width:300px;margin:10px auto 0;min-height:36px}
.th-text{display:flex;flex-direction:column;gap:16px}
.th-text .eyebrow{display:flex;justify-content:space-between}
.th-text h1{font-size:44px;line-height:1.05;letter-spacing:-.035em;font-weight:750}
.th-text h1 small{font-size:20px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.th-danger{font-style:normal;font-size:13px;font-weight:700;color:var(--red-ink);background:var(--red-bg);border-radius:999px;padding:4px 10px;vertical-align:middle;letter-spacing:0}
.th-simple{font-size:23px;line-height:1.3;font-weight:650;letter-spacing:-.015em;color:var(--ink)}
.th-def{font-size:17.5px;line-height:1.45;color:var(--muted)}
.th-label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.th-pts ol{list-style:none;counter-reset:p;display:grid;gap:6px}
.th-pts li{counter-increment:p;display:flex;gap:12px;align-items:baseline;font-size:16.5px}
.th-pts li::before{content:counter(p);font-size:13px;font-weight:700;color:var(--muted);width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:inline-grid;place-items:center;flex:none}
.th-ex{background:var(--canvas);border-radius:14px;padding:14px 18px;font-size:16.5px;line-height:1.45}
.th-safe .th-safe-body{display:none}
.th-safe.open [data-reveal-safe]{display:none}
.th-safe.open .th-safe-body{display:block}
.th-safe.open li{animation:rise .45s var(--ease) both}
.th-types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th-type{border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.4}
.th-type b{display:block;font-size:16.5px;margin-bottom:2px}
.th-type.r{background:var(--red-bg)} .th-type.r b{color:var(--red-ink)}
.th-type.y{background:var(--amber-bg)} .th-type.y b{color:var(--amber)}
.th-ws{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th-ws>div{border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.th-ws b{display:flex;align-items:center;gap:6px;width:100%;font-size:15px}
.th-ws b .i{width:16px;height:16px;stroke-width:3}
.th-ws code{font-family:var(--mono);font-size:14px;background:#fff;border-radius:8px;padding:3px 8px}
.th-ws .weak{background:var(--red-bg)} .th-ws .weak b{color:var(--red-ink)} .th-ws .weak code{text-decoration:line-through;color:var(--red-ink)}
.th-ws .strong{background:var(--green-bg)} .th-ws .strong b{color:var(--green-ink)}
.th-chips{display:flex;flex-wrap:wrap;gap:8px}
.th-chips span{padding:8px 14px;border-radius:999px;background:var(--canvas);font-size:15px;font-weight:600}
body.narrow .theory{grid-template-columns:1fr;gap:18px;padding:20px 28px}
body.narrow .th-art svg{max-height:200px}

.seal-mini{width:30px;height:30px;flex:none;margin:0 14px 0 4px}
.bottom.bare{border-top-color:transparent;background:#F7F7F5}
body.at-intro .app{grid-template-rows:60px 1fr 0}
body.at-intro .bottom{display:none}

/* minimal intro */
.hero{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:56px;padding:40px max(56px,6vw);background:#F7F7F5;text-align:left}
.hero-in{max-width:600px;display:flex;flex-direction:column;align-items:flex-start}
.hero .eyebrow{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.hero h1{font-size:56px;line-height:1.02;letter-spacing:-.045em;font-weight:750;margin:14px 0 20px;white-space:nowrap}
.hero .lead{font-size:19px;line-height:1.5;color:var(--muted);max-width:470px;margin-bottom:32px}
.hero-act{display:flex;gap:24px;align-items:center}
.hero-meta{display:flex;align-items:center;gap:10px;margin-top:44px;padding-top:20px;border-top:1px solid #E4E4E0;font-size:13.5px;font-weight:600;color:var(--muted);width:100%;max-width:470px}
.seal-meta{width:26px;height:26px;flex:none}
.hero-visual{position:relative;display:grid;place-items:center;min-height:380px}
.hero-seal{position:absolute;inset:0;margin:auto;width:min(320px,82%);aspect-ratio:1;height:auto;opacity:.11}
.hero-art{position:relative;z-index:1;width:100%;max-width:560px;align-self:end}
.hero-art svg{width:100%;height:auto;display:block}
.link-btn{font-size:15px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.link-btn:hover{color:var(--ink)}
body.narrow .hero{grid-template-columns:1fr;gap:28px;padding:32px 28px;text-align:center}
body.narrow .hero-in{align-items:center;margin:0 auto}
body.narrow .hero h1{font-size:42px;white-space:normal}
body.narrow .hero-meta{justify-content:center;margin-top:28px}
body.narrow .hero-visual{min-height:240px}

.hero .lead{font-size:19px;color:#5B5F67;max-width:440px;margin-bottom:34px}
.hero .btn-dark{min-height:50px;padding:0 26px;font-size:16px;box-shadow:0 10px 24px -10px rgba(17,18,20,.55),0 2px 0 #000}
.hero-visual{min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:40px 22px 20px;border-radius:32px;
  background:linear-gradient(180deg,#FFFFFF 0%,#F3F5FA 100%);border:1px solid rgba(22,23,26,.06);
  box-shadow:0 40px 80px -40px rgba(30,40,80,.35),0 2px 6px rgba(0,0,0,.04)}
.hero-seal{inset:auto;top:20px;left:20px;margin:0;width:54px;opacity:.55}
.hero-art{max-width:none;align-self:stretch}
.hero-cap{display:flex;justify-content:space-between;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(22,23,26,.07);font-size:13.5px;font-weight:600;color:var(--muted)}
.hero-cap span:first-child{color:var(--ink-2)}
body.narrow .hero{gap:26px}
body.narrow .hero-visual{padding:44px 22px 18px}
body.narrow .hero-kicker{margin-top:22px}


/* conclusion card: one easy line first, textbook wording below */
.concl{display:none;border:0;padding:18px 20px 16px;border-radius:18px;background:#111214;color:#fff;box-shadow:0 18px 40px -24px rgba(17,18,20,.6)}
.concl.show{display:block;animation:rise .45s var(--ease)}
.concl-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7EE2A8;margin-bottom:8px}
.concl-h .i{width:18px;height:18px}
.concl .concl-easy{font-size:20px;font-weight:650;line-height:1.32;letter-spacing:-.01em;color:#fff}
.concl-book{display:flex;flex-direction:column;gap:3px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:rgba(255,255,255,.62);line-height:1.4}
.concl-book b{color:rgba(255,255,255,.85);font-weight:600}

/* thank-you screen */
.thanks{position:relative;min-height:100%;display:grid;place-items:center;text-align:center;overflow:hidden;
  background:radial-gradient(900px 520px at 50% 30%,rgba(120,150,255,.16),transparent 62%),radial-gradient(700px 420px at 50% 100%,rgba(255,120,170,.12),transparent 60%),#FAFAF8}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.thanks-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:40px}
.thanks-seal{width:84px;height:84px;margin-bottom:18px}
.thanks-hand{width:min(560px,80vw);min-height:120px;display:grid;place-items:center}
.thanks-hand .hand-svg{width:100%}
.thanks-fallback{font-size:72px;font-weight:750;letter-spacing:-.04em}
.thanks-sub{font-size:22px;font-weight:650;color:var(--ink);margin-top:8px}
.thanks-q{font-size:17px;color:var(--muted);margin-top:8px}

/* spear phishing: email left, clues + choice right, one screen */
.sp-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.sp-side{display:flex;flex-direction:column;gap:12px}
.sp-grid .mail-body{padding:14px 20px;font-size:15px}
.sp-grid .mail-body p{margin-bottom:10px}
.sp-grid .mail-head{padding:14px 20px 10px}
.sp-grid .mail-subj{font-size:18px}
.sp-left{display:flex;flex-direction:column;gap:12px}
.sp-src{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sp-src .src{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:13px;line-height:1.25;animation:none;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.sp-src .src div{display:flex;flex-direction:column;min-width:0}
.sp-src .src div>b:first-child{display:block;font-size:13.5px}
.sp-src .src span{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.sp-grid .mail-body{font-size:14.5px;line-height:1.5}
.sp-grid .mail-meta{font-size:13.5px;line-height:1.6}
.sp-choice .choice{gap:6px}
.sp-choice .choice-btn{padding:8px 12px;font-size:14.5px;gap:10px}
.sp-choice .choice-btn .k{width:24px;height:24px;font-size:12px}
.sp-side{gap:10px}
.sp-side .pad{padding:14px 16px}
.sp-src .src:first-of-type{border-top:1px solid var(--line)}
.sp-src .src .k{width:22px;height:22px;font-size:11.5px;line-height:22px}
.sp-src .src b{font-size:14px}
body.narrow .sp-grid{grid-template-columns:1fr}

/* minimal conclusion: thin rule, one easy line, book wording in grey */
.concl{background:none;color:inherit;box-shadow:none;border-radius:0;padding:2px 0 2px 16px;border-left:2px solid var(--ink)}
.concl-h{color:var(--muted);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;margin-bottom:4px}
.concl-h .i{display:none}
.concl .concl-easy{color:var(--ink);font-size:19px;font-weight:650;line-height:1.35}
.concl-book{border-top:0;padding-top:0;margin-top:6px;font-size:13px;color:var(--muted)}
.concl-book b{color:var(--ink-2)}
.concl-book span:last-child{display:none}

/* one column when the zoomed page is narrow */
body.narrow .lesson-wrap,body.narrow .overview,body.narrow .phone-wrap{grid-template-columns:1fr}
body.narrow .lesson-wrap{display:flex;flex-direction:column}
body.narrow .learn{display:contents}
body.narrow .learn>*{margin:0 28px}
body.narrow .learn>div:first-child{order:0;margin-top:26px}
body.narrow .learn>.simple{order:1;margin-top:10px;margin-bottom:22px}
body.narrow .lesson-wrap>.work{order:2;padding:24px 28px 30px}
body.narrow .learn>div:has(.proc){order:3;margin-top:26px}
body.narrow .learn>.concl{order:4;margin-top:20px}
body.narrow .learn>.tb{order:5;margin-top:18px;margin-bottom:40px}
body.narrow .top{grid-template-columns:auto 1fr auto}
body.narrow .course{display:none}
body.narrow .bottom .msg span{display:none}
body.narrow .story{grid-template-columns:150px 1fr}
body.narrow .sum-head{flex-direction:column;align-items:flex-start}
body.narrow #sum > div[style*="grid-template-columns"]{grid-template-columns:1fr!important}
body.narrow .roles,body.narrow .mods,body.narrow .metrics,body.narrow .pw-stats{grid-template-columns:1fr 1fr}
body.narrow .rules{grid-template-columns:1fr}

@media (max-width:1px){
  .lesson-wrap,.overview,.split,.phone-wrap{grid-template-columns:1fr}
  .learn{border-right:0;border-bottom:1px solid var(--line)}
  .top{grid-template-columns:auto 1fr auto}.course{display:none}
  .bottom .msg span{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================= phones ================= */
.m-only{display:none}
body.mobile .m-only{display:inline}
body.mobile .d-only{display:none}
body.mobile .app{height:100vh;height:100dvh}
body.mobile .bottom{padding-bottom:env(safe-area-inset-bottom)}

body.mobile .bottom .pos{font-size:13px}
body.mobile .hero{padding:28px 20px 32px;gap:24px}
body.mobile .hero h1{font-size:36px;white-space:normal}
body.mobile .hero .lead{font-size:17px}
body.mobile .hero-chip{font-size:12.5px}
body.mobile .theory{padding:20px 18px 28px;gap:14px}
body.mobile .th-text h1{font-size:32px}
body.mobile .th-simple{font-size:20px}
body.mobile .th-art svg{max-height:180px}
body.mobile .learn>*{margin-left:18px;margin-right:18px}
body.mobile .learn h1{font-size:28px}
body.mobile .lesson-wrap>.work{padding:16px 14px 26px}
body.mobile .story{grid-template-columns:1fr;gap:10px}
body.mobile .story-art svg{max-height:120px;margin:0 auto}
body.mobile .story-t{font-size:17px}
body.mobile .sheet{border-radius:14px}
body.mobile .pad{padding:14px 14px}
body.mobile .mail-head,body.mobile .mail-body{padding-left:14px;padding-right:14px}
body.mobile .mail-subj{font-size:17px}
body.mobile .flow{grid-template-columns:1fr 1fr}
body.mobile .flow .node:nth-child(3){border-left:0}
body.mobile .flow .node:nth-child(n+3){border-top:1px solid var(--line)}

body.mobile .roles{grid-template-columns:1fr 1fr}
body.mobile .role:nth-child(3){border-left:0}
body.mobile .role:nth-child(n+3){border-top:1px solid var(--line)}
body.mobile .phone{margin:0 auto}
body.mobile .pw-field{flex-wrap:wrap;padding:10px}
body.mobile .pw-field input{width:100%;font-size:19px}
body.mobile .pw-field .btn{width:100%}
body.mobile .pw-stats,body.mobile .metrics,body.mobile .mods{grid-template-columns:1fr}
body.mobile .pw-stats .stat,body.mobile .metric,body.mobile .mod{border-left:0;border-top:1px solid var(--line)}
body.mobile .pw-stats .stat:first-child,body.mobile .metric:first-child,body.mobile .mod:first-child{border-top:0}
body.mobile .metric .val{font-size:30px}
body.mobile .months span{font-size:10.5px}
body.mobile .sp-src{grid-template-columns:1fr 1fr}
body.mobile .stats{grid-template-columns:1fr}
body.mobile .stats div{border-left:0;border-top:1px solid var(--line)}
body.mobile .stats div:first-child{border-top:0}
body.mobile .sum-head .meet-art{display:none}
body.mobile .page{padding:22px 18px 30px}
body.mobile .takeaway{font-size:19px}
body.mobile .thanks-fallback{font-size:48px}
body.mobile .thanks-sub{font-size:19px}
body.mobile .modal{padding:18px}
body.mobile .hero-in{padding:0 4px}
body.mobile .scene{max-height:200px}
</style>

<script>
/* ================= Core ================= */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 40) : ms));
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

document.querySelector('.top-left .icon-btn').innerHTML = ic('home');

const EXP = [
  { n:1, icon:'msg', short:'Social Engineering', pages:'pp. 174–175', title:'Social Engineering',

    aim:'To study social engineering attacks in cyber security.',
    theory:'Social engineering means fooling <strong>people</strong> to get secret information. The attacker cheats the person, not the computer.',

    result:'Social engineering concept is understood.', conclusion:'Humans are the weakest link in security systems.' },
  { n:2, icon:'mail', short:'Phishing', pages:'pp. 175–176', title:'Phishing Attacks',

    theory:'Phishing means sending <strong>fake emails or messages</strong> to steal passwords, bank details and OTPs. Example: "Your bank account is blocked, click here to login."',
    proc:['Observe fake email structure.','Identify suspicious links.','Understand data theft process.'],
    result:'Phishing attack is understood.', conclusion:'Phishing is used to steal passwords and personal data.' },

    theory:'Spear phishing is a <strong>targeted</strong> attack on one person. The attacker uses real names and details, so the email looks genuine.',

    result:'Spear phishing concept is understood.', conclusion:'It is more dangerous than normal phishing.' },
  { n:4, icon:'phone', short:'Vishing & Smishing', pages:'pp. 178–179', title:'Vishing & Smishing',

    theory:'Security awareness means teaching people to <strong>spot and avoid</strong> cyber attacks. Topics: fake emails, password safety and safe internet use.',

function refresh(){

function api(n){
  const g = state.gen[n], alive = () => state.gen[n] === g;
  return {
    alive,
    tick: i => {
      if (!alive()) return;
      state.ticks[n].add(i);
      const li = $(`#proc${n} li:nth-child(${i + 1})`); if (li) li.classList.add('done');
      if (state.ticks[n].size >= EXP[n - 1].proc.length) showConcl(n);

    decide: (key, val) => { if (!alive()) return; state.dec[n][key] = val; refresh(); },

const step = d => go(order()[Math.max(0, Math.min(order().length - 1, idxOf(state.cur) + d))]);

/* ================= Navigation ================= */
function go(k){
  k = parseKey(k); if (idxOf(k) < 0) return;
  state.cur = k; closeWhy();
  document.body.classList.toggle('at-intro', k === 0);
  $$('.screen').forEach(s => s.classList.toggle('active', parseKey(s.dataset.screen) === k));
  $$('.seg, .tdot').forEach(s => s.setAttribute('aria-current', parseKey(s.dataset.go) === k ? 'true' : 'false'));
  if (TH[k]) $(`.tdot[data-go="${k}"]`)?.classList.add('seen');
  $('#resetBtn').style.visibility = isExp(k) ? 'visible' : 'hidden';
  const sc = $(`.screen[data-screen="${k}"]`); if (sc) sc.scrollTop = 0;
  if (typeof queueFit === 'function') queueFit();
  if (k === 0) playHand('intro', $('#handIntro'));
  if (TH[k]) playHand(k, $(`#th-${k}`));
  if (k === 'thanks') playThanks();
  renderBottom();
}
function resetExp(n){
  state.gen[n]++; state.ticks[n].clear(); state.dec[n] = {}; state.fb[n] = null;
  $$(`#proc${n} li`).forEach(li => li.classList.remove('done'));
  $(`#concl${n}`).classList.remove('show'); $(`#note${n}`).innerHTML = ''; $(`#hc${n}`).innerHTML = '';
  SIMS[n]($(`#stage${n}`), api(n));
  refresh(); if (state.cur === n) renderBottom();
}
$('#resetBtn').onclick = () => { if (isExp(state.cur)) resetExp(state.cur); };
const toggleFS = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$('#fsBtn').onclick = toggleFS;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeWhy();
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === 'pagedown') { e.preventDefault(); step(1); }
  else if (k === 'arrowleft' || k === 'pageup') { e.preventDefault(); step(-1); }
  else if (/^[0-9]$/.test(k)) go(+k);
  else if (k === 'l') go(THEORY[0].key);
  else if (k === 's' && TH[state.cur]) $(`.screen[data-screen="${state.cur}"] [data-safe]`)?.classList.add('open');
  else if (k === 'f') toggleFS();
  else if (k === 'r' && isExp(state.cur)) resetExp(state.cur);
  else if (k === 'c' && isExp(state.cur)) { const c = $(`#concl${state.cur}`); if (c.classList.contains('show')) c.classList.remove('show'); else c.classList.add('show'); }
});

function theoryHTML(t, i){
  const types = t.types ? `<div class="th-types">${t.types.map(x => `<div class="th-type ${x.k}"><b>${x.t}</b><span>${x.d}</span></div>`).join('')}</div>` : '';
  const ws = t.ws ? `<div class="th-ws"><div class="weak"><b>${ic('x')}Weak</b>${t.ws.weak.map(p => `<code>${p}</code>`).join('')}</div><div class="strong"><b>${ic('check')}Strong</b>${t.ws.strong.map(p => `<code>${p}</code>`).join('')}</div></div>` : '';
  const pts = t.points ? `<div class="th-pts"><div class="th-label">${t.pointsLabel}</div><ol>${t.points.map(p => `<li>${p}</li>`).join('')}</ol></div>` : '';
  const chips = t.chips ? `<div class="th-chips">${t.chips.map(c => `<span>${c}</span>`).join('')}</div>` : '';
  const ex = t.example ? `<div class="th-ex"><div class="th-label">Example</div>${t.example}</div>` : '';
  const safe = t.safe ? `<div class="th-safe" data-safe><button class="btn btn-dark btn-sm" data-reveal-safe>${ic('shield-check')}Show how to stay safe</button>
      <div class="th-safe-body"><div class="th-label">How to stay safe</div><ul class="list">${t.safe.map((s, k) => `<li style="animation-delay:${k * 140}ms">${ic('check')}${s}</li>`).join('')}</ul></div></div>` : '';
  return `<section class="screen" data-screen="${t.key}"><div class="theory">
    <div class="th-art">${t.art}<div class="th-hand" id="th-${t.key}"></div></div>
    <div class="th-text">
      <div class="eyebrow"><span>Learn ${i} of ${THEORY.length}</span><span>${t.pages}</span></div>
      <h1>${t.title}${t.sub ? ` <small>${t.sub}</small>` : ''}${t.danger ? ' <em class="th-danger">High danger</em>' : ''}</h1>
      <p class="th-simple">${t.simple}</p>
      <p class="th-def">${t.def}</p>
      ${pts}${types}${ws}${chips}${ex}${safe}
    </div></div></section>`;
}
function buildTheory(main){
  main.insertAdjacentHTML('beforeend', THEORY.map((t, i) => theoryHTML(t, i + 1)).join(''));

}

      <div class="sheet pad"><div class="prompt">Mark the 4 yellow rows</div><p class="hint" data-hint>Malicious = did it on purpose. Negligent = careless mistake.</p><div class="count" style="margin-top:10px" data-count>0<small> / 4</small></div></div>
      <div class="sheet pad"><div class="label">Risk to the college</div><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b data-rl style="color:var(--red)">High</b><span class="hint">chance of data leaking</span></div><div class="meter"><span data-risk style="width:82%;background:var(--red)"></span></div></div>
    </div>
    <div data-a2></div>`;
  const tb = $('[data-tb]', el);
  $('[data-start]', el).onclick = async ev => {
    ev.currentTarget.parentElement.remove(); tb.innerHTML = '';
    setStatus(el, 'live', 'Live · 4 alerts'); a.tick(0);
    for (const [i, r] of rows.entries()) {
      await sleep(420); if (!a.alive()) return;
      tb.insertAdjacentHTML('beforeend', `<tr class="${r.sus ? 'sus' : ''}" data-i="${i}"><td>${r.t}</td><td><b>${r.u}</b><br><span class="hint">${r.r}</span></td><td class="act">${r.act}</td>
        <td data-v>${r.sus ? `<div class="seg3"><button data-g="normal">Normal</button><button data-g="negligent">Negligent</button><button data-g="malicious">Malicious</button></div>` : `<span class="pill">Normal</span>`}</td></tr>`);
    }
    $$('.seg3 button', tb).forEach(b => b.onclick = () => {
      const tr = b.closest('tr'), r = rows[+tr.dataset.i], cell = $('[data-v]', tr);
      if (b.dataset.g === r.v) {
        cell.innerHTML = `<span class="pill ${label[r.v][1]}">${label[r.v][0]} insider</span>`; correct++;
        $('[data-count]', el).innerHTML = `${correct}<small> / 4</small>`;
        $('[data-hint]', el).textContent = r.v === 'malicious' ? 'Correct: done on purpose, and then hidden.' : 'Correct: a careless mistake, but data still leaked.';
        if (correct === 4) finish();
      } else {
        const s = $('.seg3', cell); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
        $('[data-hint]', el).textContent = 'Not this one. Think: on purpose, or by mistake?';
      }
    });
  };
  function finish(){
    a.tick(1);
    $('[data-a2]', el).innerHTML = `<div class="sheet pad fade-in"><div class="prompt" style="margin-bottom:14px">What should the college do?</div>${choiceBtns([{ c:'breach', t:'Ignore it. They are our own people.' }, { c:'defend', t:'Give everyone only the access they need' }])}</div>`;
    $$('[data-c]', el).forEach(b => b.onclick = () => {
      const c = b.dataset.c; markChoice(el, b);
      const risk = $('[data-risk]', el), rl = $('[data-rl]', el);
      $$('tr.sus', tb).forEach(tr => tr.classList.toggle('blocked', c === 'defend'));
      if (c === 'breach') {
        risk.style.width = '100%'; risk.style.background = 'var(--red)'; rl.textContent = 'Critical'; rl.style.color = 'var(--red)';
        setStatus(el, 'danger', 'Data leaked');
        a.fb('danger', 'Exam papers and bank details leaked.', 'Question papers get sold before the exam, bank details sit in a personal inbox, and anyone can read the ERP password on GitHub. Trusting without checking is risky.');
      } else {
        risk.style.width = '18%'; risk.style.background = 'var(--green)'; rl.textContent = 'Low'; rl.style.color = 'var(--green)';
        setStatus(el, 'safe', 'Policy active');
        a.fb('safe', 'Limited access stopped every leak.', 'TAs can\'t copy papers to a pen drive, bank lists can\'t be mailed outside, passwords on GitHub get caught, and records can\'t be deleted.');
      }
      a.tick(2); a.decide('siem', c);
    });
  }
};

/* ---- 7. Awareness ---- */
SIMS[7] = (el, a) => {
  const click = [42, 31, 22, 15, 10, 6, 4], rep = [12, 25, 41, 55, 68, 80, 89];
  const W = 620, H = 160, X = i => 24 + i * ((W - 48) / 6), Y = v => H - 16 - v / 100 * (H - 32);
  const pts = (arr, n) => arr.slice(0, n + 1).map((v, i) => `${X(i)},${Y(v)}`).join(' ');
  el.innerHTML = `${toolbar('grad', 'IIIT-NR cyber awareness programme', 'Before training')}
    <div data-mods><button class="btn" data-mat>${ic('eye')}Open training material</button></div>
    <div class="sheet"><div class="metrics">
      <div class="metric"><div class="lbl"><span>Students who click fake emails</span><span>lower is better</span></div><div class="val" data-cv style="color:var(--red)">42%</div><div class="meter"><span data-cb style="width:42%;background:var(--red)"></span></div></div>
      <div class="metric"><div class="lbl"><span>Students who report them</span><span>higher is better</span></div><div class="val" data-rv style="color:var(--amber)">12%</div><div class="meter"><span data-rb style="width:12%;background:#E8A21C"></span></div></div>
    </div></div>
    <div class="sheet pad">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div class="label" style="margin:0">Month by month</div><div class="legend"><span><i style="background:var(--red)"></i>Clicked</span><span><i style="background:var(--green)"></i>Reported</span></div></div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:120px;display:block" preserveAspectRatio="none" role="img" aria-label="Trend of click rate and reporting rate">
        ${[0, 25, 50, 75, 100].map(v => `<line x1="24" x2="${W - 24}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EBEBE7"/><text x="0" y="${Y(v) + 4}" font-size="10.5" fill="#9A9EA6" font-family="system-ui">${v}</text>`).join('')}
        <polyline data-lc fill="none" stroke="#D93B3B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts(click, 0)}"/>
        <polyline data-lr fill="none" stroke="#14A44D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts(rep, 0)}"/>
      </svg>
      <div class="months" data-months>${click.map((_, i) => `<span class="${i ? '' : 'on'}">${i ? 'Month ' + i : 'Start'}</span>`).join('')}</div>
      <p class="hint" style="margin-top:10px">Sample numbers to show the idea. Not real IIIT-NR data.</p>
    </div>
    <div class="actions"><button class="btn btn-dark" data-run>${ic('play')}Run the 6-month programme</button><button class="btn btn-soft" data-base>${ic('reset')}Back to baseline</button></div>`;
  $('[data-mat]', el).onclick = () => {
    $('[data-mods]', el).innerHTML = `<div class="sheet"><div class="mods">
      <div class="mod">${ic('mail')}<b>Phishing awareness</b><p>Check who sent it, check the link, report fake SBI or college mails.</p></div>
      <div class="mod" style="animation-delay:.08s">${ic('key')}<b>Password safety</b><p>Long passwords, a different one for ERP, email and SBI, and 2-step login.</p></div>
      <div class="mod" style="animation-delay:.16s">${ic('globe')}<b>Safe internet usage</b><p>No unknown .apk files. Be careful on hostel and public Wi-Fi.</p></div></div></div>`;
    a.tick(0);
  };
  const set = i => {
    $('[data-cv]', el).textContent = click[i] + '%'; $('[data-cb]', el).style.width = click[i] + '%';
    $('[data-rv]', el).textContent = rep[i] + '%'; $('[data-rb]', el).style.width = rep[i] + '%';
    const good = i >= 4;
    $('[data-cv]', el).style.color = $('[data-cb]', el).style.background = good ? 'var(--green)' : i ? '#E8A21C' : 'var(--red)';
    $('[data-rv]', el).style.color = $('[data-rb]', el).style.background = good ? 'var(--green)' : '#E8A21C';
    $('[data-lc]', el).setAttribute('points', pts(click, i)); $('[data-lr]', el).setAttribute('points', pts(rep, i));
    $$('[data-months] span', el).forEach((s, k) => s.classList.toggle('on', k === i));
  };
  $('[data-run]', el).onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true; set(0);
    setStatus(el, 'live', 'Training in progress');
    for (let i = 1; i <= 6; i++) { await sleep(650); if (!a.alive()) return; set(i); }
    setStatus(el, 'safe', 'Trained');
    a.fb('safe', 'Clicks came down from 42% to 4%.', 'Before training, almost half the campus clicked a fake test email. After six months, very few click, and most people report it to the IT Cell.');

/* ---- 8. Password hygiene ---- */
SIMS[8] = (el, a) => {
  const COMMON = ['123456','password','12345678','qwerty','123456789','12345','111111','1234567','abc123','password1','admin','iloveyou','welcome','letmein','qwerty123','p@ssw0rd','pass@123','admin@123','india@123','india123','iiitnr@123','iiitnr123','sunshine','monkey','dragon','football'];
  const WORDS = ['123456','password','12345678','qwerty','abc123','iloveyou','admin','welcome','letmein','monkey','dragon','sunshine','football','india@123','iiitnr@123','p@ssw0rd','pass@123'];
  const analyse = pw => {
    const L = pw.length, lo = /[a-z]/.test(pw), up = /[A-Z]/.test(pw), di = /\d/.test(pw), sy = /[^A-Za-z0-9]/.test(pw);
    const pool = (lo ? 26 : 0) + (up ? 26 : 0) + (di ? 10 : 0) + (sy ? 33 : 0);
    const bits = L && pool ? L * Math.log2(pool) : 0;
    const common = COMMON.includes(pw.toLowerCase());
    const pattern = !common && /^[a-z]+[@#!._]?\d{1,4}$/i.test(pw);
    const weakRule = common || pattern;
    const level = !L ? -1 : weakRule ? 0 : bits < 40 ? 1 : bits < 60 ? 2 : bits < 80 ? 3 : 4;
    return { L, lo, up, di, sy, bits, common, pattern, weakRule, level };
  };
  const human = s => {
    if (s < 1) return 'instantly';
    if (s > 3.15e19) return 'over a trillion years';
    const u = [['seconds',60],['minutes',60],['hours',24],['days',365],['years',1e3],['thousand years',1e3],['million years',1e3],['billion years',Infinity]];
    let v = s, i = 0; while (i < u.length - 1 && v >= u[i][1]) { v /= u[i][1]; i++; }
    return (v < 10 ? v.toFixed(1) : Math.round(v).toLocaleString()) + ' ' + u[i][0];
  };
  const crackSecs = r => r.weakRule ? 0.002 : Math.pow(2, r.bits) / 2 / 1e10;
  const LV = [['Very weak','var(--red)'],['Weak','var(--red)'],['Fair','#E8A21C'],['Strong','var(--green)'],['Very strong','var(--green)']];
  el.innerHTML = `${toolbar('key', 'Password lab', 'Ready')}<p class="hint" style="margin-top:-6px">Type a password or pick one below. Then press the button to see how fast a hacker can guess it.</p>
    <div class="sheet pw-field"><input data-in type="text" placeholder="Type a sample password" autocomplete="off" spellcheck="false" aria-label="Sample password"><button class="btn btn-dark" data-crack disabled>${ic('play')}Try to crack it</button></div>
    <div class="chips"><span class="hint">Try:</span>${['123456','password','iiitnr@123','Riya2002','S3cure@2026','blue-Tiger-river-42!'].map(p => `<button class="chip" data-p="${p}">${p}</button>`).join('')}</div>
    <div class="sheet pad">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px"><b data-lvl style="font-size:18px">Waiting for a password</b><span class="hint">Use only sample passwords, never your real one.</span></div>
      <div class="bars" data-bars><span></span><span></span><span></span><span></span></div>
      <ul class="rules" style="margin-top:16px" data-rules>
        <li data-r="len">${ic('check')}12 or more characters</li><li data-r="case">${ic('check')}Upper and lower case</li>
        <li data-r="di">${ic('check')}Numbers</li><li data-r="sy">${ic('check')}Symbols</li>
        <li data-r="nc">${ic('check')}Not a common or leaked password</li><li data-r="np">${ic('check')}Not name + year, like Riya2002</li>
      </ul>
    </div>
    <div class="sheet"><div class="pw-stats">
      <div class="stat"><small>Length</small><b data-len>0</b></div>
      <div class="stat"><small>Strength (bits)</small><b data-bits>0 bits</b></div>
      <div class="stat"><small>Time to crack</small><b data-time>–</b></div>
    </div></div>
    <div class="term" data-term><span class="d"># Crack time assumes an offline attack at 10 billion guesses per second.</span></div>`;
  const inp = $('[data-in]', el), crackBtn = $('[data-crack]', el);
  const update = () => {
    const pw = inp.value, r = analyse(pw);
    crackBtn.disabled = !pw; if (pw) a.tick(0);
    $('[data-len]', el).textContent = r.L;
    $('[data-bits]', el).textContent = Math.round(r.weakRule ? Math.min(r.bits, 16) : r.bits) + ' bits';
    $('[data-time]', el).textContent = pw ? human(crackSecs(r)) : '–';
    $('[data-time]', el).style.color = !pw ? '' : r.level >= 3 ? 'var(--green)' : r.level === 2 ? '#B86E00' : 'var(--red)';
    $$('[data-bars] span', el).forEach((s, i) => s.style.background = pw && i <= Math.max(0, r.level - 1) ? LV[r.level][1] : '');
    $('[data-lvl]', el).textContent = pw ? LV[r.level][0] + (r.common ? ' · already leaked online' : r.pattern ? ' · easy-to-guess pattern' : '') : 'Waiting for a password';
    $('[data-lvl]', el).style.color = pw ? LV[r.level][1] : '';
    const ok = { len: r.L >= 12, case: r.lo && r.up, di: r.di, sy: r.sy, nc: pw && !r.common, np: pw && !r.pattern };
    $$('[data-rules] li', el).forEach(li => li.classList.toggle('ok', !!ok[li.dataset.r]));
  };
  inp.addEventListener('input', update);
  $$('[data-p]', el).forEach(c => c.onclick = () => { inp.value = c.dataset.p; update(); });
  crackBtn.onclick = async () => {
    const pw = inp.value; if (!pw) return; const r = analyse(pw), safe = pw.replace(/[<>&"]/g, '');
    const term = $('[data-term]', el);
    const p = h => { term.insertAdjacentHTML('beforeend', '<br>' + h); term.scrollTop = term.scrollHeight; };
    crackBtn.disabled = inp.disabled = true; setStatus(el, 'live', 'Cracking');
    term.innerHTML = `<span class="p">$</span> crack-sim --wordlist leaked-passwords.txt --rules best64`;
    await sleep(400); p('<span class="d">Loaded 14,344,391 leaked passwords and 64 mutation rules</span>');
    let hit = false;
    for (const w of WORDS) {
      await sleep(80); if (!a.alive()) return;
      if (r.common && w === pw.toLowerCase()) { hit = true; p(`<span class="r">MATCH  ${w}</span>`); break; }
      p(`<span class="d">try    ${w}</span>`);
    }
    if (r.common && !hit) p(`<span class="r">MATCH  ${safe}  (leaked list)</span>`);
    if (r.pattern) { await sleep(300); p('<span class="y">Rule: word + symbol + digits</span>'); await sleep(400); p(`<span class="r">MATCH  ${safe}</span>`); }
    await sleep(300);
    if (r.weakRule) {
      p('<span class="r">Cracked in 0.002 seconds</span>'); setStatus(el, 'danger', 'Cracked');
      a.fb('danger', `"${safe}" got cracked in no time.`, 'It is already in the hacker\'s list, or it follows a pattern they try first. Adding @ or numbers doesn\'t help if it is easy to guess.');
      a.decide('pw', 'breach');
    } else {
      p('<span class="g">Wordlist and rules exhausted: no match</span>'); await sleep(300);
      p(`<span class="y">Brute force needed: ${Math.round(r.bits)} bits of entropy</span>`); await sleep(400);
      const t = human(crackSecs(r));
      if (r.level >= 3) {
        p(`<span class="g">Estimated time to crack: ${t}</span>`); setStatus(el, 'safe', 'Resistant');
        a.fb('safe', `Cracking it would take ${t}.`, 'Long, random and different for every account. Keep it in a password manager and turn on 2-step login, so even a leaked password is not enough.');
        a.decide('pw', 'defend');
      } else {
        p(`<span class="r">Estimated time to crack: ${t}</span>`); setStatus(el, 'danger', 'Crackable');
        a.fb('danger', `Crackable in ${t}.`, 'Too short or too simple. Use 12+ characters, or 4 random words together.');
        a.decide('pw', 'breach');
      }
    }
    a.tick(1); crackBtn.disabled = inp.disabled = false;
  };
};

/* ================= Thank-you animation ================= */
let confettiRaf = 0;
function playThanks(){
  playHand('thanks', $('#thHand'));
  const cv = $('#confetti'); if (!cv || RM) return;
  cancelAnimationFrame(confettiRaf);
  const ctx = cv.getContext('2d');
  const W = cv.width = cv.clientWidth * 2, H = cv.height = cv.clientHeight * 2;
  const colors = ['#C9356B', '#2457D6', '#20B858', '#F5B83D', '#16171A', '#86A8FF'];
  const bits = Array.from({ length: 160 }, (_, i) => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .55,
    vx: (Math.random() - .5) * 26, vy: -(Math.random() * 30 + 18),
    r: Math.random() * 6.3, vr: (Math.random() - .5) * .35,
    w: 10 + Math.random() * 12, h: 6 + Math.random() * 8, c: colors[i % colors.length],
  }));
  const t0 = performance.now();
  const tick = now => {
    const t = now - t0;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - 2600) / 900);
    for (const b of bits) {
      b.vy += .9; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 1.5)) + 1); ctx.restore();
    }
    if (t < 3500 && state.cur === 'thanks') confettiRaf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
  };
  confettiRaf = requestAnimationFrame(tick);
}

/* ================= Projector zoom ================= */
let Z = +localStorage.getItem('hfZoom2') || 1.35;
// Z is the presenter's preferred zoom; fit() lowers it per screen so nothing needs scrolling.
const isMobile = () => innerWidth < 760;
const MIN_Z = 1.15;   // never below ~18px text; beyond that the screen scrolls
let fitting = false;
function fit(){
  if (fitting) return; fitting = true;
  const root = document.documentElement, sc = document.querySelector('.screen.active');
  let z = isMobile() ? 1 : Z; root.style.setProperty('--z', z);
  for (let k = 0; sc && !isMobile() && k < 4; k++) {
    if (sc.scrollHeight <= sc.clientHeight + 2) break;      // already fits: never shrink
    const chrome = document.body.classList.contains('at-intro') ? 60 : 60 + 76;
    const need = sc.scrollHeight + chrome + 4;              // content + top bar + bottom bar
    const zFit = innerHeight / need;
    if (zFit >= z - 0.005) break;
    z = Math.max(MIN_Z, Math.min(Z, zFit));
    root.style.setProperty('--z', z.toFixed(3));
    if (z === MIN_Z) break;
  }
  fitting = false;
}
let fitRaf = 0;
const queueFit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fit); };
function applyZoom(){
  document.body.classList.toggle('mobile', isMobile());
  document.body.classList.toggle('narrow', innerWidth / (isMobile() ? 1 : Z) < 1000);
  fit();
}
addEventListener('resize', applyZoom);
const ro = new ResizeObserver(queueFit);
document.querySelectorAll('.screen > *').forEach(el => ro.observe(el));
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '+' || e.key === '=') Z = Math.min(2.4, +(Z + 0.1).toFixed(2));
  else if (e.key === '-' || e.key === '_') Z = Math.max(1, +(Z - 0.1).toFixed(2));
  else return;
  localStorage.setItem('hfZoom2', Z); applyZoom();
});
applyZoom();

/* ================= Init ================= */
buildShell();
EXP.forEach(e => SIMS[e.n]($(`#stage${e.n}`), api(e.n)));
refresh();
go(0);
</script>
